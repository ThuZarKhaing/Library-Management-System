{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} &middot; {{ library_name }}{% endblock %}

{% block content %}
<div class="card error-card">
  <span class="error-code">{{ code }}</span>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="form-actions">
    {% if current_user %}
      <a class="button primary" href="{{ url_for('views.dashboard') }}">Back to dashboard</a>
    {% else %}
      <a class="button primary" href="{{ url_for('views.login') }}">Sign in</a>
    {% endif %}
  </div>
</div>
{% endblock %}
